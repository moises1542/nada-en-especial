<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti, mi amor 💙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a:#03040f;
    --bg-b:#100c2c;
    --bg-c:#1c1440;
    --bg-d:#0a0720;
    --moon-core:#e9e6f5;
    --moon-halo:#8b96d6;
    --mist:#6f7fb8;
    --water-tint:#04061a;
    --text-crisp:#fdf9ff;
    --text-glow-a:rgba(255,159,196,0.55);
    --text-glow-b:rgba(154,180,255,0.45);
    --hint-color:#c7bdfa;
    --wrap-black:#0c0c10;
    --wrap-charcoal:#1d1d24;
    --wrap-sheen:rgba(255,255,255,0.08);
    --caption-color:#bcd0ff;
    --petal-color:#9fb0e8;
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    background:var(--bg-a);
    font-family:'Quicksand',sans-serif;
  }

  #stage{ position:relative; width:100vw; height:100vh; cursor:default; }

  /* ================= BACKDROP ================= */
  #backdrop{
    position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 60% 40% at 78% 12%, rgba(139,150,214,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 38%, var(--bg-c) 68%, var(--bg-d) 100%);
    transition: filter 2s ease;
  }
  #backdrop.dim{ filter: brightness(0.72) saturate(0.85); }

  #vignette{
    position:absolute; inset:0; z-index:7; pointer-events:none;
    background: radial-gradient(ellipse 75% 70% at 50% 42%, transparent 45%, rgba(2,2,10,0.55) 100%);
  }

  .stars{
    position:absolute; inset:0; z-index:1;
    background-image:
      radial-gradient(1.6px 1.6px at 12% 18%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 25% 8%, #fff, transparent),
      radial-gradient(1.8px 1.8px at 38% 22%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 52% 6%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 63% 15%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 8% 32%, #fff, transparent),
      radial-gradient(1.8px 1.8px at 89% 10%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 95% 28%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 45% 32%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 70% 30%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 18% 45%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 82% 40%, #fff, transparent);
    opacity:0.5;
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle{ from{opacity:.25;} to{opacity:.6;} }

  #moon{
    position:absolute; top:8vh; right:12vw; z-index:1;
    width:110px; height:110px; border-radius:50%;
    background: radial-gradient(circle at 38% 35%, var(--moon-core) 0%, #cfd3ec 45%, #99a2c9 75%, transparent 100%);
    box-shadow:
      0 0 34px 14px rgba(139,150,214,0.18),
      0 0 80px 44px rgba(139,150,214,0.09);
    opacity:0.72;
  }
  #moon::after{
    content:''; position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle at 65% 30%, rgba(120,128,175,0.35) 0 6px, transparent 7px),
      radial-gradient(circle at 40% 60%, rgba(120,128,175,0.3) 0 9px, transparent 10px),
      radial-gradient(circle at 60% 68%, rgba(120,128,175,0.25) 0 5px, transparent 6px);
  }
  .moon-veil{
    position:absolute; z-index:1; border-radius:50%;
    background: radial-gradient(ellipse, rgba(20,18,42,0.5), transparent 72%);
    filter: blur(10px);
    animation: veilDrift 22s ease-in-out infinite alternate;
  }
  #veil1{ top:6vh; right:9vw; width:180px; height:70px; animation-delay:-4s; }
  #veil2{ top:13vh; right:15vw; width:150px; height:55px; animation-delay:-12s; }
  @keyframes veilDrift{ from{ transform:translateX(0); opacity:0.7;} to{ transform:translateX(-4vw); opacity:0.95;} }

  .mist{
    position:absolute; z-index:2; height:22vh; width:60vw; border-radius:50%;
    filter: blur(30px); opacity:0.16; mix-blend-mode:screen;
    background: radial-gradient(ellipse, var(--mist), transparent 70%);
    animation: driftMist 26s ease-in-out infinite alternate;
  }
  #mist1{ bottom:16vh; left:-10vw; animation-duration:30s; }
  #mist2{ bottom:20vh; right:-15vw; animation-duration:24s; animation-delay:-6s; opacity:0.12;}
  #mist3{ bottom:12vh; left:20vw; width:50vw; animation-duration:34s; animation-delay:-14s; opacity:0.1;}
  @keyframes driftMist{ from{ transform:translateX(0);} to{ transform:translateX(6vw);} }

  .falling-petal{
    position:absolute; top:-6vh; z-index:2;
    border-radius:70% 5% 70% 5%;
    background: linear-gradient(135deg, var(--petal-color), rgba(159,176,232,0.15));
    opacity:0;
    pointer-events:none;
    animation: petalFall linear infinite;
  }
  @keyframes petalFall{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:0.55; }
    85%{ opacity:0.4; }
    100%{ transform: translateY(112vh) translateX(var(--drift,3vw)) rotate(340deg); opacity:0; }
  }
  #petal-field{ position:absolute; inset:0; z-index:2; overflow:hidden; pointer-events:none; }

  #skyline{
    position:absolute; left:0; right:0; bottom:20vh; z-index:3;
    height:9vh; width:100%;
  }
  #skyline svg{ width:100%; height:100%; display:block; }

  #reflection-wrap{
    position:absolute; left:0; right:0; bottom:0; height:20vh; z-index:2;
    overflow:hidden;
  }
  #reflection{
    position:absolute; inset:0; width:100%; height:100%;
    filter: blur(2.5px);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent 92%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent 92%);
  }
  #water-tint{
    position:absolute; inset:0; z-index:3;
    background: linear-gradient(180deg, rgba(6,10,34,0.15) 0%, rgba(6,10,34,0.85) 100%);
    pointer-events:none;
  }
  #water-lines{
    position:absolute; inset:0; z-index:4; pointer-events:none; opacity:0.25;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0px, transparent 1.5px, transparent 6px);
  }

  canvas#fireworks{
    position:absolute; inset:0; width:100%; height:100%; z-index:5;
    transition: opacity 1.8s ease;
  }

  /* ================= TEXT SCENES ================= */
  #message-layer{
    position:absolute; inset:0; z-index:8;
    display:flex; align-items:center; justify-content:center;
    padding: 0 6vw;
  }
  .phrase{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: clamp(2.5rem, 8vw, 5.6rem);
    text-align:center; line-height:1.18;
    color: var(--text-crisp);
    margin:0;
    text-shadow:
      0 0 14px var(--text-glow-a),
      0 0 30px var(--text-glow-b);
    position:absolute;
    inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-wrap:wrap;
  }
  .phrase .ltr{
    display:inline-block;
    opacity:0;
    animation: letterIn 1.6s ease-in forwards;
  }
  .phrase .ltr.space{ width:0.32em; }
  @keyframes letterIn{ to{ opacity:1; } }

  .phrase.exit .ltr{
    animation: letterOut 0.9s ease forwards !important;
    animation-delay: 0s !important;
  }
  @keyframes letterOut{
    to{ opacity:0; }
  }

  #tap-hint{
    position:absolute; bottom:6vh; left:50%; transform:translateX(-50%);
    z-index:9;
    font-family:'Quicksand',sans-serif;
    font-size:0.85rem; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--hint-color);
    opacity:0;
    transition: opacity 0.8s ease;
    display:flex; align-items:center; gap:0.5em;
    pointer-events:none;
  }
  #tap-hint.show{ opacity:0.85; animation: hintPulse 1.8s ease-in-out infinite; }
  #tap-hint .dot{
    width:6px; height:6px; border-radius:50%; background: var(--hint-color);
    animation: dotPulse 1.8s ease-in-out infinite;
  }
  @keyframes hintPulse{ 0%,100%{ opacity:0.55;} 50%{ opacity:0.95;} }
  @keyframes dotPulse{ 0%,100%{ transform:scale(0.8); } 50%{ transform:scale(1.3); } }

  /* ================= BOUQUET SCENE ================= */
  #bouquet-scene{
    position:absolute; inset:0; z-index:6;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity 1.6s ease;
    padding: 2vh 4vw;
  }
  #bouquet-scene.show{ opacity:1; pointer-events:auto; }

  #bouquet-wrap{ width:min(86vw, 520px); }
  #bouquet-wrap svg{ width:100%; height:auto; display:block; overflow:visible; }

  .petal-fade{
    opacity:0;
    transform-box: fill-box;
    transform-origin: center;
    animation: petalIn 0.55s cubic-bezier(.22,.85,.3,1.1) forwards;
  }
  @keyframes petalIn{
    from{ opacity:0; transform: scale(0.35) translateY(4px); }
    to{ opacity:1; transform: scale(1) translateY(0); }
  }
  .wrap-fade{
    opacity:0;
    transform-box: fill-box;
    transform-origin: 50% 8%;
    animation: wrapIn 1.5s cubic-bezier(.19,.82,.24,1) forwards;
  }
  @keyframes wrapIn{
    0%{ opacity:0; transform: scale(0.86, 0.7) translateY(10px); }
    55%{ opacity:1; transform: scale(1.015, 1.02) translateY(-2px); }
    100%{ opacity:1; transform: scale(1,1) translateY(0); }
  }
  .wrap-glow{
    opacity:0;
    transform-box: fill-box;
    transform-origin: center;
    animation: wrapGlow 1.9s ease-out forwards;
  }
  @keyframes wrapGlow{
    0%{ opacity:0; transform: scale(0.3); }
    30%{ opacity:0.6; transform: scale(1.05); }
    100%{ opacity:0; transform: scale(1.7); }
  }
  .ribbon-shine{
    opacity:0;
    animation: ribbonShine 1.6s ease-in-out forwards;
  }
  @keyframes ribbonShine{
    0%{ opacity:0; transform: translateX(-40px); }
    35%{ opacity:0.9; }
    100%{ opacity:0; transform: translateX(40px); }
  }

  .heart-fade{
    opacity:0;
    transform-box: fill-box;
    transform-origin: center;
    animation: heartIn 0.7s cubic-bezier(.2,.9,.25,1.25) forwards;
  }
  @keyframes heartIn{
    0%{ opacity:0; transform: scale(0) rotate(-12deg); }
    60%{ opacity:1; transform: scale(1.25) rotate(4deg); }
    100%{ opacity:1; transform: scale(1) rotate(0deg); }
  }
  .heart-twinkle{
    animation: heartTwinkle 2.4s ease-in-out infinite;
  }
  @keyframes heartTwinkle{
    0%,100%{ opacity:0.55; transform:scale(0.85); }
    50%{ opacity:1; transform:scale(1.15); }
  }

  #caption{
    margin-top:1.4vh;
    text-align:center;
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: clamp(1.5rem, 4.2vw, 2.5rem);
    color: var(--caption-color);
    text-shadow: 0 0 14px rgba(120,150,255,0.35);
    min-height: 1.4em;
  }
  #subcaption{
    margin-top:0.3vh;
    text-align:center;
    font-family:'Quicksand',sans-serif;
    font-weight:500;
    font-size: clamp(0.85rem, 2.4vw, 1.15rem);
    letter-spacing:0.04em;
    color: var(--hint-color);
    opacity:0.92;
    min-height: 1.3em;
  }
  #caption .ltr, #subcaption .ltr{
    display:inline-block; opacity:0;
    animation: capIn 1.3s ease-in forwards;
  }
  #caption .ltr.space, #subcaption .ltr.space{ width:0.28em; }
  @keyframes capIn{ to{ opacity:1; } }

  /* ================= REPLAY ================= */
  #replay{
    position:absolute; bottom:3vh; left:50%; transform:translateX(-50%);
    z-index:10;
    background: linear-gradient(135deg, #2c3f8a, #131a3d);
    color:#e9edff; border:1px solid rgba(180,195,255,0.25);
    padding:0.6em 1.6em; border-radius:999px;
    font-family:'Quicksand',sans-serif; font-weight:600; font-size:0.9rem;
    letter-spacing:0.03em; cursor:pointer;
    box-shadow: 0 8px 22px rgba(10,15,50,0.5);
    opacity:0; pointer-events:none;
    transition: opacity 1s ease, transform 0.2s ease;
  }
  #replay.show{ opacity:1; pointer-events:auto; }
  #replay:hover{ transform:translateX(-50%) translateY(-2px); }

  /* ================= INTRO PANEL ================= */
  #intro-panel{
    position:absolute; inset:0; z-index:40;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: opacity 1.3s cubic-bezier(.4,.0,.2,1), transform 1.3s cubic-bezier(.4,.0,.2,1), filter 1.3s ease;
    background: radial-gradient(ellipse 70% 55% at 50% 45%, rgba(20,15,56,0.35), rgba(4,5,26,0.55) 75%);
  }
  #intro-panel.leaving{
    opacity:0;
    transform: scale(1.18);
    filter: blur(10px);
    pointer-events:none;
  }
  canvas#intro-sparks{
    position:absolute; inset:0; z-index:41; pointer-events:none;
  }
  #intro-content{
    position:relative; z-index:42;
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    padding: 0 6vw;
    user-select:none;
  }
  #heart-wrap{
    position:relative;
    width: 168px; height:168px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 2.2vh;
  }
  #progress-ring{
    position:absolute; inset:0;
    transform: rotate(-90deg);
    overflow:visible;
  }
  #progress-ring circle{
    fill:none;
  }
  #progress-ring .ring-bg{
    stroke: rgba(199,189,250,0.18);
    stroke-width:3;
  }
  #progress-ring .ring-fill{
    stroke: url(#ringGradient);
    stroke-width:3.4;
    stroke-linecap:round;
    stroke-dasharray: 452;
    stroke-dashoffset: 452;
    transition: stroke-dashoffset 0.45s cubic-bezier(.3,.8,.3,1);
    filter: drop-shadow(0 0 6px rgba(255,159,196,0.6));
  }
  #heart-icon{
    width: 92px; height:92px;
    transform: scale(1);
    transition: transform 0.28s cubic-bezier(.3,.6,.3,1.6);
    filter: drop-shadow(0 0 10px rgba(255,110,150,0.55)) drop-shadow(0 0 22px rgba(154,120,255,0.35));
  }
  #heart-wrap.pulse #heart-icon{ transform: scale(1.18); }
  #heart-wrap.ready #heart-icon{
    animation: heartReady 0.9s ease-in-out infinite;
  }
  @keyframes heartReady{
    0%,100%{ transform:scale(1.05); filter: drop-shadow(0 0 14px rgba(255,110,150,0.85)) drop-shadow(0 0 32px rgba(154,120,255,0.55)); }
    50%{ transform:scale(1.2); filter: drop-shadow(0 0 22px rgba(255,140,175,0.95)) drop-shadow(0 0 44px rgba(180,150,255,0.7)); }
  }
  #intro-title{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: clamp(2rem, 6.5vw, 3.2rem);
    color: var(--text-crisp);
    margin: 0 0 0.3em 0;
    text-shadow: 0 0 14px var(--text-glow-a), 0 0 28px var(--text-glow-b);
  }
  #intro-hint{
    font-family:'Quicksand',sans-serif;
    font-size:0.82rem; letter-spacing:0.09em; text-transform:uppercase;
    color: var(--hint-color);
    opacity:0.85;
    margin:0;
    animation: hintPulse 1.8s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce){
    .ltr, .petal-fade, .wrap-fade, .heart-fade{ animation:none !important; opacity:1 !important; transform:none !important; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="backdrop"></div>
  <div id="vignette"></div>
  <div class="stars"></div>
  <div id="moon"></div>
  <div class="moon-veil" id="veil1"></div>
  <div class="moon-veil" id="veil2"></div>
  <div id="petal-field"></div>
  <div class="mist" id="mist1"></div>
  <div class="mist" id="mist2"></div>
  <div class="mist" id="mist3"></div>

  <div id="skyline">
    <svg viewBox="0 0 1200 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,120 L0,70 L30,70 L30,50 L60,50 L60,80 L100,80 L100,40 L120,40 L120,60 L150,60 L150,30 L175,30 L175,65 L210,65 L210,45 L240,45 L240,90 L280,90 L280,55 L300,55 L300,75 L340,75 L340,20 L365,20 L365,60 L400,60 L400,85 L440,85 L440,50 L470,50 L470,70 L510,70 L510,35 L540,35 L540,80 L580,80 L580,55 L610,55 L610,25 L640,25 L640,65 L680,65 L680,90 L720,90 L720,45 L750,45 L750,70 L790,70 L790,40 L820,40 L820,60 L860,60 L860,80 L900,80 L900,50 L935,50 L935,30 L965,30 L965,70 L1005,70 L1005,55 L1040,55 L1040,85 L1080,85 L1080,45 L1110,45 L1110,65 L1150,65 L1150,75 L1200,75 L1200,120 Z" fill="#080a1e"/>
      <rect x="70" y="60" width="3" height="4" fill="#5b6fb8" opacity="0.55"/>
      <rect x="145" y="42" width="3" height="4" fill="#8ea1e0" opacity="0.5"/>
      <rect x="255" y="70" width="3" height="4" fill="#5b6fb8" opacity="0.5"/>
      <rect x="355" y="35" width="3" height="4" fill="#8ea1e0" opacity="0.55"/>
      <rect x="460" y="60" width="3" height="4" fill="#5b6fb8" opacity="0.45"/>
      <rect x="565" y="65" width="3" height="4" fill="#8ea1e0" opacity="0.5"/>
      <rect x="670" y="75" width="3" height="4" fill="#5b6fb8" opacity="0.5"/>
      <rect x="770" y="55" width="3" height="4" fill="#8ea1e0" opacity="0.5"/>
      <rect x="870" y="68" width="3" height="4" fill="#5b6fb8" opacity="0.45"/>
      <rect x="985" y="45" width="3" height="4" fill="#8ea1e0" opacity="0.5"/>
      <rect x="1090" y="60" width="3" height="4" fill="#5b6fb8" opacity="0.5"/>
    </svg>
  </div>

  <div id="reflection-wrap">
    <canvas id="reflection"></canvas>
    <div id="water-tint"></div>
    <div id="water-lines"></div>
  </div>

  <canvas id="fireworks"></canvas>

  <div id="message-layer">
    <h1 class="phrase" id="phrase1"></h1>
    <h1 class="phrase" id="phrase2" style="display:none;"></h1>
  </div>

  <div id="tap-hint"><span class="dot"></span><span id="hint-text">Toca para continuar</span></div>

  <div id="bouquet-scene">
    <div id="bouquet-wrap">
      <svg id="bouquet-svg" viewBox="0 0 420 520" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="caption"></div>
    <div id="subcaption"></div>
  </div>

  <button id="replay">Reproducir de nuevo 💙</button>

  <div id="intro-panel">
    <canvas id="intro-sparks"></canvas>
    <div id="intro-content">
      <div id="heart-wrap">
        <svg id="progress-ring" viewBox="0 0 156 156">
          <defs>
            <linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff9fc4"/>
              <stop offset="100%" stop-color="#9ab4ff"/>
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="78" cy="78" r="72"/>
          <circle class="ring-fill" id="ring-fill" cx="78" cy="78" r="72"/>
        </svg>
        <svg id="heart-icon" viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffb3cf"/>
              <stop offset="55%" stop-color="#ff6f9c"/>
              <stop offset="100%" stop-color="#e0457d"/>
            </linearGradient>
          </defs>
          <path fill="url(#heartGrad)" d="M16 29 C16 29 0 18.5 0 8.8 C0 3.6 4 0 8.5 0 C11.4 0 14.2 1.6 16 4.4 C17.8 1.6 20.6 0 23.5 0 C28 0 32 3.6 32 8.8 C32 18.5 16 29 16 29 Z"/>
        </svg>
      </div>
      <p id="intro-title">Tengo algo para ti</p>
      <p id="intro-hint">Toca el corazón</p>
    </div>
  </div>

  <audio id="bg-music" preload="auto"></audio>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     BACKGROUND MUSIC — soft fade-in on the first panel,

  const bgMusic = document.getElementById('bg-music');
  bgMusic.src = 'data:audio/mp3;base64,' + AUDIO_B64;
  bgMusic.loop = false;
  bgMusic.volume = 0;

  let musicStarted = false;
  let fadeRaf = null;

  function fadeAudioTo(target, durationMs){
    if(fadeRaf) cancelAnimationFrame(fadeRaf);
    const startVol = bgMusic.volume;
    const startTime = performance.now();
    function step(now){
      const t = Math.min((now - startTime) / durationMs, 1);
      const eased = t * (2 - t); // ease-out, feels smoother than linear
      bgMusic.volume = startVol + (target - startVol) * eased;
      if(t < 1) fadeRaf = requestAnimationFrame(step);
    }
    fadeRaf = requestAnimationFrame(step);
  }

  function startBackgroundMusic(){
    if(musicStarted) return;
    musicStarted = true;
    bgMusic.currentTime = 0;
    bgMusic.volume = 0;
    const playPromise = bgMusic.play();
    if(playPromise && playPromise.then){
      playPromise.then(()=>{
        fadeAudioTo(0.75, 2600); // gentle, soft start
      }).catch(()=>{
        // autoplay blocked — retry on the very next tap anywhere
        musicStarted = false;
      });
    } else {
      fadeAudioTo(0.75, 2600);
    }
  }

  // graceful ending: fade out over the last few seconds instead of stopping abruptly
  bgMusic.addEventListener('timeupdate', ()=>{
    if(bgMusic.duration && !isNaN(bgMusic.duration)){
      const remaining = bgMusic.duration - bgMusic.currentTime;
      if(remaining <= 3.5 && remaining > 0 && bgMusic.volume > 0.02){
        fadeAudioTo(0, Math.max(remaining, 0.3) * 1000);
      }
    }
  });

  function stopBackgroundMusic(){
    if(fadeRaf) cancelAnimationFrame(fadeRaf);
    bgMusic.pause();
    bgMusic.currentTime = 0;
    bgMusic.volume = 0;
    musicStarted = false;
  }

  // try to start as early as possible; if the browser blocks autoplay
  // before any interaction, the first tap on the heart (which the
  // experience already requires) starts it instead
  startBackgroundMusic();
  document.addEventListener('pointerdown', startBackgroundMusic, { once:true, capture:true });

  /* =========================================================
     FALLING PETALS — slow, soft, melancholic atmosphere
  ========================================================= */
  const petalField = document.getElementById('petal-field');
  function spawnPetal(){
    const p = document.createElement('div');
    p.className = 'falling-petal';
    const size = rand(7,14);
    p.style.width = size + 'px';
    p.style.height = (size*0.7) + 'px';
    p.style.left = rand(0,100) + 'vw';
    const dur = rand(14,24);
    p.style.animationDuration = dur + 's';
    p.style.setProperty('--drift', rand(-6,6) + 'vw');
    p.style.filter = 'blur(' + rand(0,0.6).toFixed(1) + 'px)';
    petalField.appendChild(p);
    setTimeout(()=> p.remove(), dur*1000 + 200);
  }
  for(let i=0;i<5;i++) setTimeout(spawnPetal, i*1400);
  setInterval(spawnPetal, 2600);

  /* =========================================================
     FIREWORKS ENGINE — dense chrysanthemum bursts over water
  ========================================================= */
  const canvas = document.getElementById('fireworks');
  const ctx = canvas.getContext('2d');
  const reflCanvas = document.getElementById('reflection');
  const reflCtx = reflCanvas.getContext('2d');
  let W, H, reflH;

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    reflCanvas.width = window.innerWidth;
    reflH = reflCanvas.height = document.getElementById('reflection-wrap').clientHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function rand(a,b){ return a + Math.random()*(b-a); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  // Vivid themed palettes for dazzling, high-contrast bursts
  const PALETTES = [
    { core:'#fffef2', outer:['#ff3b52','#ff8a3d','#ffd35c','#ffef9e'] },
    { core:'#fff5fb', outer:['#ff3d94','#ff7fc0','#ffb3e0','#ffffff'] },
    { core:'#fffdf0', outer:['#ffcf3d','#fff29e','#ffffff','#ffe066'] },
    { core:'#f2f8ff', outer:['#3d8bff','#7fb8ff','#c6e0ff','#ffffff'] },
    { core:'#fff2f2', outer:['#ff4d4d','#ffb199','#ffe3b0','#ff8a3d'] },
    { core:'#f6f2ff', outer:['#b06bff','#d9a9ff','#ff9fc4','#ffffff'] }
  ];

  const MAX_PARTICLES = 1500;
  let particles = [];
  let rockets = [];
  let flashes = [];
  let spawning = true;
  let spawnTimer = null;

  function launchRocket(){
    const targetX = rand(W*0.1, W*0.9);
    rockets.push({
      x: targetX + rand(-40,40),
      y: H*0.85,
      targetY: rand(H*0.12, H*0.42),
      speed: rand(8, 12),
      hist: [],
      palette: pick(PALETTES)
    });
  }

  function addFlash(x,y,color,maxR){
    flashes.push({ x, y, r:1, maxR: maxR || 90, alpha:0.9, color });
  }

  function burst(x, y, palette, scale){
    scale = scale || 1;
    if(particles.length > MAX_PARTICLES) return;

    addFlash(x, y, palette.core, rand(70,120)*scale);

    // main radiating chrysanthemum ring — dense and colorful
    const ringCount = Math.floor(rand(190,270) * scale);
    for(let i=0;i<ringCount;i++){
      const angle = (Math.PI*2*i)/ringCount + rand(-0.035,0.035);
      const speed = rand(2.6, 7.2) * scale;
      const useCore = Math.random() < 0.2;
      particles.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        alpha: 1,
        color: useCore ? palette.core : pick(palette.outer),
        size: rand(1.5,3.0),
        hist: [],
        gravity: 0.05,
        drag: 0.988,
        decay: rand(0.007,0.011),
        sparkle: Math.random() < 0.6,
        glow: true,
        secondary: !useCore && Math.random() < 0.18
      });
    }

    // long outer trailing sparks — the dazzling streaks like a grand finale
    const trailCount = Math.floor(rand(26,38) * scale);
    for(let i=0;i<trailCount;i++){
      const angle = (Math.PI*2*i)/trailCount + rand(-0.05,0.05);
      const speed = rand(6.8, 9.6) * scale;
      particles.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        alpha: 1,
        color: pick(palette.outer),
        size: rand(1.2,2.0),
        hist: [],
        gravity: 0.065,
        drag: 0.978,
        decay: rand(0.009,0.013),
        sparkle: true,
        glow: true,
        secondary: Math.random() < 0.35
      });
    }

    // inner bright core burst (denser, shorter, brilliant)
    const coreCount = Math.floor(rand(45,65) * scale);
    for(let i=0;i<coreCount;i++){
      const angle = rand(0, Math.PI*2);
      const speed = rand(0.6,2.4) * scale;
      particles.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        alpha: 1,
        color: palette.core,
        size: rand(1.8,3.2),
        hist: [],
        gravity: 0.04,
        drag: 0.98,
        decay: rand(0.013,0.019),
        sparkle: true,
        glow: true,
        secondary:false
      });
    }
  }

  function secondaryFlicker(x,y){
    const n = Math.floor(rand(8,16));
    for(let i=0;i<n;i++){
      const angle = rand(0,Math.PI*2);
      const speed = rand(0.5,2.0);
      particles.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        alpha: 1,
        color: pick(['#ffe9a8','#fff6d6','#ffffff']),
        size: rand(0.9,1.7),
        hist: [],
        gravity: 0.028,
        drag: 0.97,
        decay: rand(0.02,0.032),
        sparkle:true,
        glow:true,
        secondary: false
      });
    }
  }

  function drawTrail(p, x2, y2){
    if(p.hist.length){
      ctx.beginPath();
      ctx.moveTo(p.hist[0].x, p.hist[0].y);
      for(let i=1;i<p.hist.length;i++) ctx.lineTo(p.hist[i].x, p.hist[i].y);
      ctx.lineTo(x2,y2);
      ctx.strokeStyle = p.color;
      ctx.globalAlpha = Math.max(p.alpha*0.55,0);
      ctx.lineWidth = p.size*0.8;
      ctx.stroke();
    }
  }

  function tick(){
    ctx.clearRect(0,0,W,H);

    // bright expanding flash bloom at each explosion
    for(let i=flashes.length-1;i>=0;i--){
      const f = flashes[i];
      f.r += (f.maxR - f.r) * 0.28;
      f.alpha -= 0.07;
      if(f.alpha <= 0){ flashes.splice(i,1); continue; }
      const grad = ctx.createRadialGradient(f.x,f.y,0, f.x,f.y,f.r);
      grad.addColorStop(0, f.color);
      grad.addColorStop(0.35, 'rgba(255,255,255,0.35)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = Math.max(f.alpha,0);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // rockets ascending with glowing trail
    for(let i=rockets.length-1;i>=0;i--){
      const r = rockets[i];
      r.hist.push({x:r.x,y:r.y});
      if(r.hist.length>6) r.hist.shift();
      r.y -= r.speed;
      r.x += Math.sin(r.y*0.02)*0.4;

      if(r.hist.length){
        ctx.beginPath();
        ctx.moveTo(r.hist[0].x, r.hist[0].y);
        for(let j=1;j<r.hist.length;j++) ctx.lineTo(r.hist[j].x, r.hist[j].y);
        ctx.lineTo(r.x,r.y);
        ctx.strokeStyle = r.palette.core;
        ctx.globalAlpha = 0.85;
        ctx.lineWidth = 2.2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = r.palette.core;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
      ctx.beginPath();
      ctx.fillStyle = r.palette.core;
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 12;
      ctx.shadowColor = r.palette.core;
      ctx.arc(r.x, r.y, 2.4, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;

      if(r.y <= r.targetY){
        burst(r.x, r.y, r.palette, rand(1.0,1.35));
        rockets.splice(i,1);
      }
    }

    // particles — bright, glowing, with streaking trails
    ctx.globalAlpha = 1;
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      const nx = p.x + p.vx;
      const ny = p.y + p.vy;

      if(p.sparkle){
        drawTrail(p, nx, ny);
      }

      p.hist.push({x:p.x,y:p.y});
      if(p.hist.length>4) p.hist.shift();

      p.x = nx; p.y = ny;
      p.vy += p.gravity;
      p.vx *= p.drag;
      p.vy *= p.drag;
      p.alpha -= p.decay;

      if(p.secondary && p.alpha < 0.55 && !p.didSecondary){
        p.didSecondary = true;
        if(Math.random()<0.55) secondaryFlicker(p.x,p.y);
      }

      if(p.alpha <= 0 || p.y > H*0.86){
        particles.splice(i,1);
        continue;
      }

      const flicker = p.sparkle ? (0.65 + Math.random()*0.4) : 1;
      ctx.beginPath();
      ctx.globalAlpha = Math.max(p.alpha,0) * flicker;
      ctx.fillStyle = p.color;
      if(p.glow){
        ctx.shadowBlur = 9;
        ctx.shadowColor = p.color;
      }
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;

    // reflection: mirror the lower portion of the sky where bursts glow
    reflCtx.clearRect(0,0,reflCanvas.width, reflH);
    reflCtx.save();
    reflCtx.globalAlpha = 0.45;
    reflCtx.translate(0, reflH);
    reflCtx.scale(1,-1);
    reflCtx.drawImage(canvas, 0, H - reflH, W, reflH, 0, 0, reflCanvas.width, reflH);
    reflCtx.restore();

    fwRaf = requestAnimationFrame(tick);
  }
  let fwRaf = requestAnimationFrame(tick);

  function startSpawning(){
    spawning = true;
    if(spawnTimer) clearInterval(spawnTimer);
    // launch in fuller clustered volleys for a dazzling, packed sky
    spawnTimer = setInterval(()=>{
      if(!spawning) return;
      launchRocket();
      if(Math.random() < 0.7){
        setTimeout(()=> spawning && launchRocket(), rand(90,220));
      }
      if(Math.random() < 0.45){
        setTimeout(()=> spawning && launchRocket(), rand(220,400));
      }
      if(Math.random() < 0.2){
        setTimeout(()=> spawning && launchRocket(), rand(400,560));
      }
    }, 400);
  }
  function stopSpawning(){
    spawning = false;
    if(spawnTimer) clearInterval(spawnTimer);
  }

  /* =========================================================
     TEXT SEQUENCE — crisp letters, click-to-advance
  ========================================================= */
  const phrase1El = document.getElementById('phrase1');
  const phrase2El = document.getElementById('phrase2');
  const hint = document.getElementById('tap-hint');
  const hintText = document.getElementById('hint-text');
  const stageEl = document.getElementById('stage');
  const replayBtn = document.getElementById('replay');

  const PHRASE_1 = "Te amo mucho mi amor";
  const PHRASE_2 = "Estas flores son para ti, preciosa";

  function buildLetters(container, text, step, letterDur){
    letterDur = letterDur || 1.6;
    container.innerHTML = '';
    let idx = 0;
    let lastDelay = 0;
    for(const ch of text){
      const span = document.createElement('span');
      span.className = 'ltr' + (ch === ' ' ? ' space' : '');
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      span.style.animationDelay = (idx*step) + 's';
      container.appendChild(span);
      idx++;
      lastDelay = idx*step;
    }
    return lastDelay + letterDur; // seconds until the last letter has fully faded in
  }

  let flowState = 'idle'; // idle -> phrase1 -> phrase2 -> bouquet -> done
  let awaitingClick = false;

  function showHint(text){
    hintText.textContent = text;
    hint.classList.add('show');
  }
  function hideHint(){ hint.classList.remove('show'); }

  function beginPhrase1(){
    flowState = 'phrase1';
    phrase1El.style.display = 'flex';
    phrase1El.classList.remove('exit');
    phrase2El.style.display = 'none';
    const dur = buildLetters(phrase1El, PHRASE_1, 0.09, 1.6);
    hideHint();
    awaitingClick = false;
    setTimeout(()=>{
      awaitingClick = true;
      showHint('Toca para continuar');
    }, dur*1000);
  }

  function advanceToPhrase2(){
    awaitingClick = false;
    hideHint();
    phrase1El.classList.add('exit');
    setTimeout(()=>{
      phrase1El.style.display = 'none';
      phrase2El.style.display = 'flex';
      flowState = 'phrase2';
      const dur = buildLetters(phrase2El, PHRASE_2, 0.07, 1.6);
      setTimeout(()=>{
        awaitingClick = true;
        showHint('Toca para ver tu regalo');
      }, dur*1000);
    }, 650);
  }

  function advanceToBouquet(){
    awaitingClick = false;
    hideHint();
    flowState = 'transition';
    phrase2El.classList.add('exit');
    stopSpawning();
    canvas.style.opacity = '0';
    document.getElementById('backdrop').classList.add('dim');
    document.getElementById('skyline').style.transition = 'opacity 1.5s ease';
    document.getElementById('skyline').style.opacity = '0.35';
    document.getElementById('reflection-wrap').style.transition = 'opacity 1.5s ease';
    document.getElementById('reflection-wrap').style.opacity = '0.35';

    setTimeout(()=>{
      phrase2El.style.display = 'none';
      buildBouquet();
      document.getElementById('bouquet-scene').classList.add('show');
      flowState = 'bouquet';
    }, 900);
  }

  stageEl.addEventListener('click', (e)=>{
    if(e.target === replayBtn) return;
    if(!awaitingClick) return;
    if(flowState === 'phrase1') advanceToPhrase2();
    else if(flowState === 'phrase2') advanceToBouquet();
  });

  /* =========================================================
     BOUQUET — procedurally built layered blue roses,
     dark elegant wrap, professional cluster silhouette,
     plus small elaborate floating hearts
  ========================================================= */
  const svgNS = 'http://www.w3.org/2000/svg';
  const bouquetSvg = document.getElementById('bouquet-svg');
  const captionEl = document.getElementById('caption');
  const subcaptionEl = document.getElementById('subcaption');

  const PALETTES_ROSE = {
    royal:    { light:'#8fb0f5', mid:'#5279e0', dark:'#33509f', deepest:'#1c2c66' },
    sky:      { light:'#bfe0fb', mid:'#7fb8ef', dark:'#4a8fd0', deepest:'#295c8f' },
    peri:     { light:'#c3cbfa', mid:'#8f9bf2', dark:'#5f6bd4', deepest:'#3a3f96' },
    icy:      { light:'#e6f4ff', mid:'#b8ddfb', dark:'#82b8ea', deepest:'#4f83b3' },
    sapphire: { light:'#7191dd', mid:'#3e57ab', dark:'#233374', deepest:'#121c47' },
    blush:    { light:'#ffd6e6', mid:'#ff9fc4', dark:'#e0679c', deepest:'#8f3f66' },
    lilac:    { light:'#e3d6fb', mid:'#c3a9f5', dark:'#9270d8', deepest:'#4f3c86' }
  };

  function petalPath(len, w){
    return `M0,0 C ${-w},${-len*0.28} ${-w*0.68},${-len} 0,${-len} C ${w*0.68},${-len} ${w},${-len*0.28} 0,0 Z`;
  }

  function addPetal(parent, angleDeg, len, w, fill, delay, outward, strokeColor){
    const g = document.createElementNS(svgNS,'g');
    g.setAttribute('transform', `rotate(${angleDeg}) translate(0,${-(outward||0)})`);
    const p = document.createElementNS(svgNS,'path');
    p.setAttribute('d', petalPath(len, w));
    p.setAttribute('fill', fill);
    if(strokeColor){
      p.setAttribute('stroke', strokeColor);
      p.setAttribute('stroke-width','0.55');
      p.setAttribute('stroke-opacity','0.5');
    }
    p.classList.add('petal-fade');
    p.style.animationDelay = delay.toFixed(3)+'s';
    g.appendChild(p);
    parent.appendChild(g);
  }

  function buildRose(cx, cy, scale, paletteKey, startDelay){
    const palette = PALETTES_ROSE[paletteKey];
    const rose = document.createElementNS(svgNS,'g');
    rose.setAttribute('transform', `translate(${cx},${cy}) scale(${scale})`);

    const layers = [
      { count:7, len:34, w:15.5, outward:11, rot:0,  key:'light', base:0.30, step:0.045 },
      { count:6, len:25, w:12,   outward:6,  rot:24, key:'mid',   base:0.62, step:0.045 },
      { count:5, len:17, w:8.5,  outward:2.5,rot:8,  key:'dark',  base:0.90, step:0.04  }
    ];

    layers.forEach(layer=>{
      for(let i=0;i<layer.count;i++){
        const jitter = (Math.random()*8-4);
        const angle = layer.rot + (360/layer.count)*i + jitter;
        const len = layer.len * (0.9 + Math.random()*0.18);
        const w = layer.w * (0.9 + Math.random()*0.18);
        const delay = startDelay + layer.base + i*layer.step;
        addPetal(rose, angle, len, w, palette[layer.key], delay, layer.outward, palette.deepest);
      }
    });

    // spiral bud center
    for(let i=0;i<3;i++){
      const angle = i*120 + 20;
      addPetal(rose, angle, 9, 5, palette.deepest, startDelay+1.12+i*0.03, 1, null);
    }
    const dot = document.createElementNS(svgNS,'circle');
    dot.setAttribute('r','2');
    dot.setAttribute('fill', palette.deepest);
    dot.classList.add('petal-fade');
    dot.style.animationDelay = (startDelay+1.25)+'s';
    rose.appendChild(dot);

    // gloss highlight
    const hi = document.createElementNS(svgNS,'ellipse');
    hi.setAttribute('cx','-9'); hi.setAttribute('cy','-15');
    hi.setAttribute('rx','6.5'); hi.setAttribute('ry','11');
    hi.setAttribute('fill','rgba(255,255,255,0.22)');
    hi.setAttribute('transform','rotate(-18)');
    hi.classList.add('petal-fade');
    hi.style.animationDelay = (startDelay+1.3)+'s';
    rose.appendChild(hi);

    bouquetSvg.appendChild(rose);
  }

  // small filler blossoms (5-petal) to thicken the cluster without heavy weight
  function buildFillerFlower(cx, cy, scale, paletteKey, startDelay){
    const palette = PALETTES_ROSE[paletteKey];
    const g = document.createElementNS(svgNS,'g');
    g.setAttribute('transform', `translate(${cx},${cy}) scale(${scale})`);
    const petalCount = 5;
    for(let i=0;i<petalCount;i++){
      const angle = (360/petalCount)*i + rand(-6,6);
      addPetal(g, angle, 12, 6.5, palette.mid, startDelay + i*0.035, 3, palette.deepest);
    }
    const center = document.createElementNS(svgNS,'circle');
    center.setAttribute('r','3.2');
    center.setAttribute('fill', palette.light);
    center.classList.add('petal-fade');
    center.style.animationDelay = (startDelay+0.22)+'s';
    g.appendChild(center);
    bouquetSvg.appendChild(g);
  }

  function leafPath(len, w){
    return `M0,0 C ${w},${-len*0.2} ${w*0.9},${-len*0.75} 0,${-len} C ${-w*0.9},${-len*0.75} ${-w},${-len*0.2} 0,0 Z`;
  }
  function addLeaf(cx, cy, angle, len, w, delay){
    const g = document.createElementNS(svgNS,'g');
    g.setAttribute('transform', `translate(${cx},${cy}) rotate(${angle})`);
    const p = document.createElementNS(svgNS,'path');
    p.setAttribute('d', leafPath(len,w));
    p.setAttribute('fill', '#1e3a2b');
    p.setAttribute('stroke', '#132719');
    p.setAttribute('stroke-width','0.5');
    p.classList.add('petal-fade');
    p.style.animationDelay = delay+'s';
    g.appendChild(p);
    bouquetSvg.appendChild(g);
  }

  // elaborate little heart: layered fill + rim-light stroke + tiny sparkle
  function heartPath(s){
    // s = size scale factor, path centered near origin, tip pointing down
    return `M0,${0.34*s} C0,${0.34*s} ${-0.5*s},${-0.02*s} ${-0.5*s},${-0.28*s}
            C${-0.5*s},${-0.46*s} ${-0.34*s},${-0.58*s} ${-0.18*s},${-0.58*s}
            C${-0.08*s},${-0.58*s} 0,${-0.5*s} 0,${-0.42*s}
            C0,${-0.5*s} ${0.08*s},${-0.58*s} ${0.18*s},${-0.58*s}
            C${0.34*s},${-0.58*s} ${0.5*s},${-0.46*s} ${0.5*s},${-0.28*s}
            C${0.5*s},${-0.02*s} 0,${0.34*s} 0,${0.34*s} Z`;
  }

  function addLittleHeart(cx, cy, size, rotate, delay, twinkle){
    const g = document.createElementNS(svgNS,'g');
    g.setAttribute('transform', `translate(${cx},${cy}) rotate(${rotate||0})`);
    g.classList.add('heart-fade');
    g.style.animationDelay = delay.toFixed(3)+'s';

    const uid = 'hg' + Math.floor(Math.random()*1e6);
    const defs = document.createElementNS(svgNS,'defs');
    const grad = document.createElementNS(svgNS,'linearGradient');
    grad.setAttribute('id', uid);
    grad.setAttribute('x1','0'); grad.setAttribute('y1','0');
    grad.setAttribute('x2','0'); grad.setAttribute('y2','1');
    grad.innerHTML = `
      <stop offset="0%" stop-color="#ffe3ef"/>
      <stop offset="45%" stop-color="#ff9fc4"/>
      <stop offset="100%" stop-color="#e05c96"/>
    `;
    defs.appendChild(grad);
    g.appendChild(defs);

    // soft glow halo
    const halo = document.createElementNS(svgNS,'circle');
    halo.setAttribute('r', (size*0.72).toFixed(2));
    halo.setAttribute('fill', 'rgba(255,180,210,0.28)');
    g.appendChild(halo);

    // main heart body
    const body = document.createElementNS(svgNS,'path');
    body.setAttribute('d', heartPath(size));
    body.setAttribute('fill', `url(#${uid})`);
    body.setAttribute('stroke', '#ffffff');
    body.setAttribute('stroke-opacity','0.35');
    body.setAttribute('stroke-width', (size*0.03).toFixed(2));
    g.appendChild(body);

    // inner highlight sheen (small ellipse upper-left)
    const sheen = document.createElementNS(svgNS,'ellipse');
    sheen.setAttribute('cx', (-size*0.16).toFixed(2));
    sheen.setAttribute('cy', (-size*0.22).toFixed(2));
    sheen.setAttribute('rx', (size*0.11).toFixed(2));
    sheen.setAttribute('ry', (size*0.16).toFixed(2));
    sheen.setAttribute('fill','rgba(255,255,255,0.55)');
    sheen.setAttribute('transform', 'rotate(-25)');
    g.appendChild(sheen);

    // tiny sparkle accent (4-point star) if requested
    if(twinkle){
      const star = document.createElementNS(svgNS,'path');
      const sx = size*0.62, sy = -size*0.5;
      const sk = size*0.16;
      star.setAttribute('d', `M${sx} ${sy-sk} L${sx+sk*0.28} ${sy-sk*0.28} L${sx+sk} ${sy} L${sx+sk*0.28} ${sy+sk*0.28} L${sx} ${sy+sk} L${sx-sk*0.28} ${sy+sk*0.28} L${sx-sk} ${sy} L${sx-sk*0.28} ${sy-sk*0.28} Z`);
      star.setAttribute('fill', '#fff6fb');
      star.classList.add('heart-twinkle');
      star.style.animationDelay = (Math.random()*1.5).toFixed(2)+'s';
      g.appendChild(star);
    }

    bouquetSvg.appendChild(g);
  }

  function buildWrap(delay){
    const g = document.createElementNS(svgNS,'g');
    g.classList.add('wrap-fade');
    g.style.animationDelay = delay+'s';

    g.innerHTML = `
      <defs>
        <linearGradient id="wrapGradL" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2e2e38"/>
          <stop offset="55%" stop-color="#16161c"/>
          <stop offset="100%" stop-color="#08080a"/>
        </linearGradient>
        <linearGradient id="wrapGradR" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#34343f"/>
          <stop offset="55%" stop-color="#19191f"/>
          <stop offset="100%" stop-color="#0a0a0c"/>
        </linearGradient>
        <linearGradient id="wrapGradC" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#44444f"/>
          <stop offset="100%" stop-color="#111116"/>
        </linearGradient>
        <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#6f7fd9"/>
          <stop offset="50%" stop-color="#a7b3ff"/>
          <stop offset="100%" stop-color="#6f7fd9"/>
        </linearGradient>
      </defs>

      <!-- single unified cone silhouette, no overlapping stray triangles -->
      <path d="M96 300
               C 90 340, 100 400, 150 468
               C 172 494, 248 494, 270 468
               C 320 400, 330 340, 324 300
               C 300 322, 258 336, 210 336
               C 162 336, 120 322, 96 300 Z"
            fill="url(#wrapGradC)"/>

      <path d="M96 300 C 90 340, 100 400, 150 468 C 160 480, 178 487, 195 490
               C 175 460, 150 400, 148 320 C 148 312, 150 305, 154 298
               C 132 300, 112 300, 96 300 Z"
            fill="url(#wrapGradL)"/>

      <path d="M324 300 C 330 340, 320 400, 270 468 C 260 480, 242 487, 225 490
               C 245 460, 270 400, 272 320 C 272 312, 270 305, 266 298
               C 288 300, 308 300, 324 300 Z"
            fill="url(#wrapGradR)"/>

      <!-- subtle paper fold lines -->
      <path d="M160 320 C 158 370, 168 425, 195 480" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.3"/>
      <path d="M260 320 C 262 370, 252 425, 225 480" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.3"/>
      <path d="M210 330 L 210 486" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.1"/>

      <!-- ribbon wrap around the neck -->
      <path d="M120 314 C 150 330, 270 330, 300 314 L300 328 C 270 344, 150 344, 120 328 Z"
            fill="url(#ribbonGrad)" opacity="0.9"/>
      <path d="M120 314 C 150 330, 270 330, 300 314" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>

      <!-- bow -->
      <ellipse cx="210" cy="316" rx="26" ry="16" fill="#1c1c22" stroke="#4a4a58" stroke-width="1.5"/>
      <path d="M210 316 C 180 296, 158 302, 148 322 C 164 330, 190 328, 210 316 Z" fill="#22222a" stroke="#4a4a58" stroke-width="1.5"/>
      <path d="M210 316 C 240 296, 262 302, 272 322 C 256 330, 230 328, 210 316 Z" fill="#22222a" stroke="#4a4a58" stroke-width="1.5"/>
      <path d="M203 326 C 197 358, 195 400, 204 442" fill="none" stroke="#28282f" stroke-width="4" stroke-linecap="round"/>
      <path d="M217 326 C 223 358, 225 400, 216 442" fill="none" stroke="#28282f" stroke-width="4" stroke-linecap="round"/>
      <circle cx="210" cy="316" r="7.5" fill="#0c0c10" stroke="#4a4a58" stroke-width="1"/>
    `;
    bouquetSvg.appendChild(g);

    // soft light burst behind the bow the moment the wrap appears
    const glow = document.createElementNS(svgNS,'circle');
    glow.setAttribute('cx','210'); glow.setAttribute('cy','316'); glow.setAttribute('r','70');
    glow.setAttribute('fill', 'radial-gradient(circle, #cfd8ff, transparent)');
    const glowGrad = document.createElementNS(svgNS,'radialGradient');
    const glowId = 'wrapGlowGrad' + Math.floor(Math.random()*1e6);
    glowGrad.setAttribute('id', glowId);
    glowGrad.innerHTML = `<stop offset="0%" stop-color="#dbe3ff" stop-opacity="0.9"/><stop offset="55%" stop-color="#a7b3ff" stop-opacity="0.35"/><stop offset="100%" stop-color="#a7b3ff" stop-opacity="0"/>`;
    const glowDefs = document.createElementNS(svgNS,'defs');
    glowDefs.appendChild(glowGrad);
    bouquetSvg.appendChild(glowDefs);
    glow.setAttribute('fill', `url(#${glowId})`);
    glow.classList.add('wrap-glow');
    glow.style.animationDelay = (delay+0.25)+'s';
    bouquetSvg.appendChild(glow);

    // a thin shine sweeps across the ribbon once it settles
    const shine = document.createElementNS(svgNS,'path');
    shine.setAttribute('d','M132 316 C 160 328, 260 328, 288 316');
    shine.setAttribute('fill','none');
    shine.setAttribute('stroke','#ffffff');
    shine.setAttribute('stroke-width','2.2');
    shine.setAttribute('stroke-linecap','round');
    shine.setAttribute('opacity','0.7');
    shine.classList.add('ribbon-shine');
    shine.style.animationDelay = (delay+0.55)+'s';
    bouquetSvg.appendChild(shine);
  }

  // Places flowers around an elliptical arc (a natural dome silhouette,
  // wide at the "equator" and rounded at the top — the way a real
  // hand-tied bouquet head sits above its wrapped stems).
  function ringFlowers(cx, cy, rx, ry, angleStart, angleEnd, count, kind, scaleMin, scaleMax, palettes, delayStart, delayStep){
    for(let i=0;i<count;i++){
      const t = count === 1 ? 0.5 : i/(count-1);
      const angle = angleStart + (angleEnd-angleStart)*t + rand(-5,5);
      const rad = angle*Math.PI/180;
      const jitter = rand(0.93,1.07);
      const x = cx + Math.cos(rad)*rx*jitter;
      const y = cy + Math.sin(rad)*ry*jitter;
      const scale = rand(scaleMin,scaleMax);
      const pal = palettes[i % palettes.length];
      const delay = delayStart + i*delayStep;
      if(kind === 'rose') buildRose(x,y,scale,pal,delay);
      else buildFillerFlower(x,y,scale,pal,delay);
    }
  }

  function ringLeaves(cx, cy, rx, ry, angles, len, w, delayStart, delayStep){
    angles.forEach((angle, i)=>{
      const rad = angle*Math.PI/180;
      const x = cx + Math.cos(rad)*rx;
      const y = cy + Math.sin(rad)*ry;
      const rot = angle - 270; // orient leaf tip outward along the radius
      addLeaf(x, y, rot, len*rand(0.9,1.1), w*rand(0.9,1.1), delayStart + i*delayStep);
    });
  }

  function ringHearts(cx, cy, rx, ry, angleStart, angleEnd, count, delayStart, delayStep){
    for(let i=0;i<count;i++){
      const t = count === 1 ? 0.5 : i/(count-1);
      const angle = angleStart + (angleEnd-angleStart)*t + rand(-6,6);
      const rad = angle*Math.PI/180;
      const x = cx + Math.cos(rad)*rx;
      const y = cy + Math.sin(rad)*ry;
      addLittleHeart(x, y, rand(11,16), rand(-15,15), delayStart + i*delayStep, Math.random() < 0.5);
    }
  }

  // Randomly packs small buds across the whole bouquet head so no
  // sliver of background ever peeks through between the placed flowers.
  function scatterFill(cx, cy, rx, ry, angleStart, angleEnd, count, palettes, delayStart, delayStep){
    for(let i=0;i<count;i++){
      const angle = rand(angleStart, angleEnd);
      const rad = angle*Math.PI/180;
      const rFrac = Math.sqrt(rand(0.12,1));
      const x = cx + Math.cos(rad)*rx*rFrac;
      const y = cy + Math.sin(rad)*ry*rFrac;
      const scale = rand(0.28,0.46);
      const pal = palettes[Math.floor(Math.random()*palettes.length)];
      buildFillerFlower(x,y,scale,pal, delayStart + i*delayStep);
    }
  }

  function buildBouquet(){
    bouquetSvg.innerHTML = '';

    const cx = 210;

    // ===== leaves peeking from behind the outer edge of the dome =====
    ringLeaves(cx, 200, 208, 128, [168, 196, 226, 270, 314, 344, 372], 44, 15, 0.05, 0.04);

    // ===== outer ring: small filler blossoms that widen the silhouette =====
    ringFlowers(cx, 202, 198, 122, 168, 372, 14, 'filler', 0.48, 0.62,
      ['sapphire','lilac','peri','blush'], 0.3, 0.06);

    // ===== back ring: muted roses, appear first, set the dome's edge =====
    ringFlowers(cx, 210, 172, 106, 175, 365, 11, 'rose', 0.7, 0.84,
      ['sapphire','peri','royal','lilac'], 1.2, 0.13);

    // ===== leaves nestled in the second layer =====
    ringLeaves(cx, 218, 152, 94, [190, 230, 270, 310, 350], 32, 12, 2.9, 0.05);

    // ===== filler ring: thickens the body between back and middle =====
    ringFlowers(cx, 220, 144, 90, 190, 350, 10, 'filler', 0.6, 0.74,
      ['blush','sky','lilac','peri'], 3.2, 0.08);

    // ===== middle ring: fuller, richer roses =====
    ringFlowers(cx, 226, 114, 70, 205, 335, 8, 'rose', 0.95, 1.08,
      ['royal','icy','sky','royal'], 4.6, 0.18);

    // ===== leaves close to the front cluster =====
    ringLeaves(cx, 230, 98, 58, [220, 250, 270, 290, 320], 27, 10, 5.9, 0.05);

    // ===== filler ring near the front for a dense, natural fullness =====
    ringFlowers(cx, 232, 86, 52, 212, 328, 7, 'filler', 0.68, 0.8,
      ['blush','peri','sky'], 6.1, 0.08);

    // ===== front hero roses: largest, richest, sit forward and center =====
    ringFlowers(cx, 238, 55, 33, 222, 318, 5, 'rose', 1.15, 1.3,
      ['icy','royal','sapphire','lilac'], 6.9, 0.24);

    // ===== collar: fills the shoulders and neck gap right above the wrap =====
    ringFlowers(cx, 254, 178, 58, 168, 372, 11, 'filler', 0.5, 0.64,
      ['sapphire','peri','blush','lilac','sky'], 8.0, 0.06);
    addLeaf(58, 262, -32, 34, 12, 8.1);
    addLeaf(362, 262, 32, 34, 12, 8.12);
    addLeaf(88, 288, -18, 28, 10, 8.16);
    addLeaf(332, 288, 18, 28, 10, 8.18);

    // ===== small leaves bridging the flower head into the wrap =====
    addLeaf(158, 292, -22, 30, 10, 8.24);
    addLeaf(262, 292, 22, 30, 10, 8.26);
    addLeaf(210, 304, 0, 24, 9, 8.28);

    // ===== wrap =====
    buildWrap(8.9);

    // ===== small elaborate hearts framing the bouquet =====
    ringHearts(cx, 202, 220, 144, 190, 350, 9, 9.3, 0.12);

    const totalDelay = 10.8;
    setTimeout(()=>{
      buildLetters(captionEl, 'Para ti, mi amor', 0.07, 1.3);
    }, totalDelay*1000);

    setTimeout(()=>{
      replayBtn.classList.add('show');
    }, (totalDelay+1.6)*1000);
  }

  /* =========================================================
     INTRO PANEL — romantic heart, sparks on tap, opens the gift
  ========================================================= */
  const introPanel = document.getElementById('intro-panel');
  const introSparksCanvas = document.getElementById('intro-sparks');
  const introSparksCtx = introSparksCanvas.getContext('2d');
  const heartWrap = document.getElementById('heart-wrap');
  const ringFill = document.getElementById('ring-fill');
  const introHint = document.getElementById('intro-hint');

  const TAPS_NEEDED = 6;
  const RING_CIRC = 2 * Math.PI * 72; // matches r=72 in the ring svg
  ringFill.style.strokeDasharray = RING_CIRC.toFixed(1);
  ringFill.style.strokeDashoffset = RING_CIRC.toFixed(1);

  let tapCount = 0;
  let introSparks = [];
  let introRaf = null;

  function sizeIntroCanvas(){
    introSparksCanvas.width = window.innerWidth;
    introSparksCanvas.height = window.innerHeight;
  }
  sizeIntroCanvas();
  window.addEventListener('resize', sizeIntroCanvas);

  const SPARK_COLORS = ['#ffd1e0','#ff9fc4','#c9b8ff','#ffe9a8','#ffffff'];

  function spawnSparkBurst(x, y, count, power){
    count = count || 16;
    power = power || 1;
    for(let i=0;i<count;i++){
      const angle = rand(0, Math.PI*2);
      const speed = rand(1.5, 4.2) * power;
      introSparks.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed - rand(0,1.2),
        alpha:1,
        size: rand(1.2,2.6),
        color: pick(SPARK_COLORS),
        decay: rand(0.02,0.035),
        hist:[]
      });
    }
  }

  function tickIntroSparks(){
    introSparksCtx.clearRect(0,0,introSparksCanvas.width, introSparksCanvas.height);
    for(let i=introSparks.length-1;i>=0;i--){
      const s = introSparks[i];
      s.hist.push({x:s.x,y:s.y});
      if(s.hist.length>4) s.hist.shift();
      s.x += s.vx; s.y += s.vy;
      s.vy += 0.045;
      s.vx *= 0.97; s.vy *= 0.97;
      s.alpha -= s.decay;
      if(s.alpha<=0){ introSparks.splice(i,1); continue; }

      if(s.hist.length>1){
        introSparksCtx.beginPath();
        introSparksCtx.moveTo(s.hist[0].x, s.hist[0].y);
        for(let j=1;j<s.hist.length;j++) introSparksCtx.lineTo(s.hist[j].x, s.hist[j].y);
        introSparksCtx.strokeStyle = s.color;
        introSparksCtx.globalAlpha = Math.max(s.alpha*0.5,0);
        introSparksCtx.lineWidth = s.size*0.7;
        introSparksCtx.stroke();
      }
      introSparksCtx.beginPath();
      introSparksCtx.globalAlpha = Math.max(s.alpha,0);
      introSparksCtx.fillStyle = s.color;
      introSparksCtx.arc(s.x, s.y, s.size, 0, Math.PI*2);
      introSparksCtx.fill();
    }
    introSparksCtx.globalAlpha = 1;
    introRaf = requestAnimationFrame(tickIntroSparks);
  }

  function heartCenter(){
    const r = heartWrap.getBoundingClientRect();
    return { x: r.left + r.width/2, y: r.top + r.height/2 };
  }

  function handleIntroTap(e){
    if(introPanel.classList.contains('leaving')) return;
    const pt = (e.touches && e.touches[0]) ? e.touches[0] : e;
    const x = pt.clientX, y = pt.clientY;

    spawnSparkBurst(x, y, 14, 1);

    tapCount = Math.min(tapCount+1, TAPS_NEEDED);
    const progress = tapCount / TAPS_NEEDED;
    ringFill.style.strokeDashoffset = (RING_CIRC * (1-progress)).toFixed(1);

    heartWrap.classList.remove('pulse');
    void heartWrap.offsetWidth;
    heartWrap.classList.add('pulse');
    setTimeout(()=> heartWrap.classList.remove('pulse'), 260);

    if(tapCount >= TAPS_NEEDED){
      heartWrap.classList.add('ready');
      introHint.textContent = 'Abriendo tu sorpresa...';
      const c = heartCenter();
      spawnSparkBurst(c.x, c.y, 60, 2.4);
      setTimeout(()=> spawnSparkBurst(c.x, c.y, 40, 1.8), 140);
      setTimeout(openExperience, 550);
    } else if(tapCount === TAPS_NEEDED - 1){
      introHint.textContent = 'Una vez mas...';
    } else {
      introHint.textContent = 'Toca el corazon';
    }
  }

  introPanel.addEventListener('click', handleIntroTap);

  function openExperience(){
    introPanel.removeEventListener('click', handleIntroTap);
    introPanel.classList.add('leaving');
    startSpawning();
    beginPhrase1();
    setTimeout(()=>{
      cancelAnimationFrame(introRaf);
      introSparks = [];
      introSparksCtx.clearRect(0,0,introSparksCanvas.width, introSparksCanvas.height);
    }, 1400);
  }

  /* =========================================================
     REPLAY / INIT
  ========================================================= */
  function resetAll(){
    // reset music so it starts fresh with a soft fade-in again
    stopBackgroundMusic();

    // reset backdrop / water
    document.getElementById('backdrop').classList.remove('dim');
    document.getElementById('skyline').style.opacity = '1';
    document.getElementById('reflection-wrap').style.opacity = '1';
    canvas.style.opacity = '1';
    particles = []; rockets = []; flashes = [];
    stopSpawning();

    // reset text
    phrase1El.style.display = 'flex';
    phrase1El.classList.remove('exit');
    phrase1El.innerHTML = '';
    phrase2El.style.display = 'none';
    phrase2El.classList.remove('exit');
    phrase2El.innerHTML = '';
    hideHint();

    // reset bouquet
    document.getElementById('bouquet-scene').classList.remove('show');
    bouquetSvg.innerHTML = '';
    captionEl.innerHTML = '';
    replayBtn.classList.remove('show');

    // reset intro panel
    tapCount = 0;
    heartWrap.classList.remove('ready','pulse');
    ringFill.style.strokeDashoffset = RING_CIRC.toFixed(1);
    introHint.textContent = 'Toca el corazon';
    introPanel.classList.remove('leaving');
    introPanel.addEventListener('click', handleIntroTap);
    introRaf = requestAnimationFrame(tickIntroSparks);
  }

  replayBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    resetAll();
    startBackgroundMusic();
  });

  // initial run — wait at the romantic panel until the heart is tapped enough times
  introRaf = requestAnimationFrame(tickIntroSparks);

})();
</script>
